schema: egoagentos.higress-policy.v1
consumer_groups:
  scout-readonly:
    routes: [repo_snapshot, repo_read_files]
    rate_limit_per_minute: 60
  runtime-bounded:
    routes: [dataset_create_manifest, dataset_verify_manifest, gpu_launch_experiment, gpu_job_status]
    rate_limit_per_minute: 30
    requires_control_plane_policy_header: true
  evaluator-readonly:
    routes: [metrics_compare_paired, dataset_verify_manifest]
    rate_limit_per_minute: 60
  reviewer-readonly:
    routes: [repo_read_files, dataset_verify_manifest, metrics_compare_paired]
    rate_limit_per_minute: 60
upstream_secret_policy:
  inject_at_gateway: true
  forward_to_worker: false
  redact_headers: [authorization, x-api-key, x-acs-security-token]
audit:
  correlation_headers: [traceparent, x-ego-task-id, x-ego-tool-call-id]
  record_request_body: schema_redacted
  record_response_body: schema_redacted
fail_closed_on:
  - missing_consumer_identity
  - unknown_route
  - policy_header_mismatch
  - approval_scope_mismatch
