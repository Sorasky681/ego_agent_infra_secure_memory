name: egoagentos-researchops

services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      EGO_DB_PATH: /data/egoagentos.sqlite3
      EGO_CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      EGO_MCP_APPROVAL_HMAC_SECRET: ${EGO_MCP_APPROVAL_HMAC_SECRET:-}
      EGO_HICLAW_URL: ${EGO_HICLAW_URL:-}
      EGO_NACOS_URL: ${EGO_NACOS_URL:-}
      EGO_HIGRESS_URL: ${EGO_HIGRESS_URL:-}
    volumes:
      - egoagentos-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  egoagentos-data:
