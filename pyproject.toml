[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoagentos-researchops"
version = "0.1.0"
description = "Evidence-gated multi-agent ResearchOps control plane"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111,<0.116",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.11,<0.15",
]

[tool.setuptools.packages.find]
include = ["apps.api*"]
namespaces = true

[tool.setuptools.package-data]
"apps.api" = ["fixtures/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/api"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100
